name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    tags:
      - "v*"

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup java
        uses: actions/setup-java@v4
        with:
          # project uses gradle 6.7 + agp 4.1; needs java 11 (not 17+)
          distribution: temurin
          java-version: "11"

      - name: setup flutter
        uses: subosito/flutter-action@v2
        with:
          # this app targets dart 2.x (sdk: ">=2.18.0 <3.0.0")
          # flutter 3.7.x is the last line that still ships dart 2.19
          flutter-version: "3.7.12"
          channel: stable
          cache: true

      - name: flutter doctor
        run: flutter doctor -v

      - name: pub get
        run: flutter pub get

      - name: restore keystore if provided
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -e
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/qinglong.keystore
            echo "keystore restored"
          else
            echo "no ANDROID_KEYSTORE_BASE64 secret; will build unsigned/debug-friendly if signing fails"
          fi

      - name: patch signing for ci when no keystore
        run: |
          set -e
          if [ ! -f android/app/qinglong.keystore ]; then
            python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          text = p.read_text()
          # fall back to debug signing when release keystore missing
          text = text.replace(
              "signingConfig signingConfigs.release",
              "signingConfig signingConfigs.debug",
          )
          p.write_text(text)
          print("patched build.gradle to use debug signing")
          PY
          fi

      - name: build apk
        run: flutter build apk --release

      - name: upload apk
        uses: actions/upload-artifact@v4
        with:
          name: qinglong-glass-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

  ios:
    # macos-13 was retired from hosted runners: jobs targeting it queue forever
    # instead of failing. macos-14 (arm64) is the oldest label still served.
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # oldest xcode on the macos-14 image. flutter 3.7 predates xcode 15,
          # so pods need the deployment-target bump in the patch step below.
          xcode-version: "15.0.1"

      - name: setup flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.7.12"
          channel: stable
          architecture: arm64
          cache: true

      - name: pub get
        run: flutter pub get

      # flutter 3.7 predates xcode 15: its new linker breaks the Flutter
      # framework link (-ld_classic works around it) and pods still declare
      # deployment targets below xcode 15's floor. both go in post_install.
      - name: patch podfile for xcode 15
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          p = Path("ios/Podfile")
          t = p.read_text()
          anchor = "    flutter_additional_ios_build_settings(target)"
          assert anchor in t, "podfile post_install anchor missing"
          t = t.replace(anchor, anchor + """
              target.build_configurations.each do |config|
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '14.0'
                config.build_settings['OTHER_LDFLAGS'] = '$(inherited) -ld_classic'
              end""", 1)
          p.write_text(t)
          print(t[t.index("post_install"):])
          PY

      - name: build ios (unsigned)
        # no apple cert in ci, so the ipa is unsigned and needs sideloading
        # (sideloadly / altstore / trollstore); it won't install on a stock device.
        run: flutter build ios --release --no-codesign

      - name: package unsigned ipa
        run: |
          set -e
          cd build/ios
          rm -rf Payload
          mkdir Payload
          cp -R iphoneos/Runner.app Payload/
          # -y keeps framework symlinks as symlinks; -x drops finder junk
          zip -qry qinglong-glass-unsigned.ipa Payload -x '*.DS_Store'
          ls -la qinglong-glass-unsigned.ipa

      - name: upload ipa
        uses: actions/upload-artifact@v4
        with:
          name: qinglong-glass-ipa
          path: build/ios/qinglong-glass-unsigned.ipa
          if-no-files-found: error

  release:
    needs: [android, ios]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # this repo's default workflow permission is read-only, so GITHUB_TOKEN
    # gets 403 "Resource not accessible by integration" on release create.
    permissions:
      contents: write
    steps:
      # one release step for both platforms: two jobs each calling
      # action-gh-release on the same tag race each other on create.
      - name: download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/qinglong-glass-apk/*.apk
            dist/qinglong-glass-ipa/*.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
